<style>
:root{--bg:#000;--panel:#120a1f;--line:#2a1b45;--p:#8b3dff;--p2:#c4a1ff;--tx:#f3ecff;--mut:#a89bc2;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Cairo",system-ui,sans-serif;line-height:1.8}
a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0}
.logo{font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:8px}
.lang{display:flex;direction:ltr;flex-shrink:0;gap:2px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:999px}
.lang button{background:none;border:0;border-radius:999px;color:var(--mut);font:inherit;font-size:.85rem;font-weight:600;letter-spacing:.04em;min-width:42px;min-height:32px;padding:0 12px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--p);color:#fff}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:50px 0 70px}
h1{font-size:clamp(2.4rem,7vw,4.4rem);line-height:1.15;margin:0 0 16px;font-weight:800}
.hero p{color:var(--mut);font-size:1.1rem;max-width:34em;margin:0 0 26px}
.btn{display:inline-block;background:var(--p);color:#fff;text-decoration:none;font-weight:600;padding:12px 28px;border-radius:10px}
.btn:hover{background:#9d5cff}
.chart{width:100%;height:auto}
.crown-glow{animation:glow 3s ease-in-out 1}
@keyframes glow{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.crown-glow{animation:none}}
section{padding:50px 0;border-top:1px solid var(--line)}
h2{font-size:1.8rem;margin:0 0 8px}
.sub{color:var(--mut);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.card h3{margin:0 0 6px;color:var(--p2)}
.card p{margin:0;color:var(--mut)}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}
label{display:block;margin-bottom:12px;color:var(--mut);font-size:.95rem}
input{width:100%;background:#000;border:1px solid var(--line);border-radius:8px;color:var(--tx);font:inherit;padding:8px 12px;margin-top:4px}
.res{display:flex;flex-direction:column;justify-content:center;gap:6px}
.big{font-size:2.4rem;font-weight:800;color:var(--p2);line-height:1.2}
.note{color:var(--mut);font-size:.9rem}
footer{border-top:1px solid var(--line);padding:30px 0 100px;color:var(--mut);font-size:.88rem}
.about-grid{display:grid;grid-template-columns:220px 1fr;gap:32px;align-items:start}
.about p{color:var(--mut);font-size:1.1rem;margin:0 0 14px;max-width:38em}
.about .vm{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0}
.about .vm .card p{font-size:1rem;margin:0}
.about p.close{color:var(--tx);font-weight:600;margin:0}
.photo{aspect-ratio:4/5;width:220px;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;align-items:flex-end}
.photo svg,.photo img{width:100%;display:block}.photo img{height:100%;object-fit:cover;object-position:top}
section,footer{scroll-margin-top:56px}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;gap:6px;overflow-x:auto;padding:8px 0;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;color:var(--mut);padding:4px 16px;border-radius:999px}
.nav a:hover{color:var(--tx);background:var(--panel)}
.fab{position:fixed;z-index:20;inset-inline-end:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;background:var(--p);color:#fff;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:999px;box-shadow:0 6px 24px rgba(139,61,255,.45)}
.fab:hover{background:#9d5cff}
.nav{transition:transform .25s}.nav.hide{transform:translateY(-120%)}
.fab{transition:transform .25s,opacity .25s}.fab.hide{transform:translateY(140%);opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.nav,.fab{transition:none}}
.js .rv{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease;transition-delay:var(--d,0s)}
.js .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.js .rv{opacity:1;transform:none;transition:none}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.social{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 24px}
.social a{border:1px solid var(--line);border-radius:999px;padding:6px 20px;text-decoration:none;color:var(--tx)}
.social a:hover{border-color:var(--p);color:var(--p2)}
.social a.wa{background:var(--p);border-color:var(--p)}
footer h2{margin-bottom:16px;color:var(--tx)}footer p{margin:0}
@media (max-width:760px){.hero,.grid,.calc,.about-grid,.about .vm{grid-template-columns:1fr}.hero{padding-top:20px}.photo{width:180px}}
</style>

document.documentElement.classList.add("js");var lang="ar";
try{var s=localStorage.getItem("lang");if(s==="en"||s==="ar"||s==="fr")lang=s}catch(e){}
function apply(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.title=T[lang].brand+" | Oussama El Moqaddam";
  document.querySelectorAll('meta[name=description],meta[property="og:description"]').forEach(function(m){m.content=T[lang].desc});
  document.querySelectorAll('meta[property="og:title"]').forEach(function(m){m.content=document.title});
  document.querySelectorAll("[data-i18n]").forEach(function(el){el.textContent=T[lang][el.dataset.i18n]});
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===lang)});
  calc();
}
function fmt(n){return n.toLocaleString({ar:"ar-EG",en:"en-US",fr:"fr-FR"}[lang],{maximumFractionDigits:2})}
function calc(){
  var c=+cap.value,r=+risk.value,e=+entry.value,s=+stop.value;
  var d=Math.abs(e-s),loss=c*r/100;
  document.getElementById("loss").textContent=isFinite(loss)?fmt(loss):"—";
  document.getElementById("size").textContent=d>0&&isFinite(loss)?fmt(loss/d):T[lang].bad;
}
document.querySelectorAll(".lang button").forEach(function(b){b.onclick=function(){lang=b.dataset.l;try{localStorage.setItem("lang",lang)}catch(e){}apply()}});
["cap","risk","entry","stop"].forEach(function(id){document.getElementById(id).oninput=calc});
var rv=document.querySelectorAll("section h2,section .sub,.about-grid>*,.card,.calc,footer>*");
rv.forEach(function(el){el.classList.add("rv");el.style.setProperty("--d",Math.min(Array.prototype.indexOf.call(el.parentNode.children,el),4)*0.1+"s")});
if("IntersectionObserver" in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.12,rootMargin:"0px 0px -6% 0px"});
  rv.forEach(function(el){io.observe(el)});
}else{rv.forEach(function(el){el.classList.add("in")})}
var nav=document.querySelector(".nav"),fab=document.querySelector(".fab"),lastY=0,tick=false;
window.addEventListener("scroll",function(){
  if(tick)return;tick=true;
  requestAnimationFrame(function(){
    var y=window.scrollY||0,down=y>lastY+4,up=y<lastY-4;
    if(y<80||up){nav.classList.remove("hide");fab.classList.remove("hide")}
    else if(down){nav.classList.add("hide");fab.classList.add("hide")}
    if(down||up)lastY=y;tick=false;
  });
},{passive:true});
apply();
</script>
